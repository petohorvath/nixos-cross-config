name: Project checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    uses: petohorvath/nixos-project-policy/.github/workflows/check.yml@v0.4.0
    with:
      project: nixos-cross-config
      policy_version: v0.4.0
      required_architectures: '["x86_64-linux", "aarch64-linux"]'
